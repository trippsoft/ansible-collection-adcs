---
name: Molecule - signed_certificate role
'on':
  workflow_dispatch: {}
  pull_request:
    branches:
      - main
    paths:
      - galaxy.yml
      - roles/signed_certificate/**
      - '!roles/signed_certificate/.aar_doc.yml'
      - '!roles/signed_certificate/README.md'
      - '!roles/signed_certificate/meta/argument_specs.yml'
      - '!roles/signed_certificate/meta/main.yml'
  push:
    branches:
      - main
    paths:
      - galaxy.yml
      - roles/signed_certificate/**
      - '!roles/signed_certificate/.aar_doc.yml'
      - '!roles/signed_certificate/README.md'
      - '!roles/signed_certificate/meta/argument_specs.yml'
      - '!roles/signed_certificate/meta/main.yml'
defaults:
  run:
    working-directory: 'trippsc2.adcs'
jobs:
  molecule_linux:
    name: Run Molecule tests - Linux to file
    runs-on:
      - self-hosted
      - linux
      - ansible
      - x64
    strategy:
      fail-fast: false
      matrix:
        box:
          - debian13_base
          - fedora43_base
          - fedora44_base
          - rocky8_cis
          - rocky9_cis
          - rocky10_base
          - ubuntu2204_base
          - ubuntu2404_base
          - ubuntu2604_base
        ansible:
          - '2.16'
          - '2.21'
        exclude:
          - box: rocky8_cis
            ansible: '2.21'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: 'trippsc2.adcs'
      - name: Run Molecule tests
        run: |
          source ~/venv/ansible-${{ matrix.ansible }}/bin/activate
          rm -rf ~/.ansible/collections/ansible_collections/*
          cd ./roles/signed_certificate
          molecule test -s linux
          rm -rf ~/.ansible/collections/ansible_collections/*
          deactivate
        env:
          ANSIBLE_FORCE_COLOR: '1'
          PY_COLORS: '1'
          MOLECULE_BOX: ${{ matrix.box }}
          MOLECULE_ANSIBLE_VERSION: ${{ matrix.ansible }}
  molecule_linux_pipe:
    name: Run Molecule tests - Linux to variable
    runs-on:
      - self-hosted
      - linux
      - ansible
      - x64
    strategy:
      fail-fast: false
      matrix:
        box:
          - debian13_base
          - fedora43_base
          - fedora44_base
          - rocky8_cis
          - rocky9_cis
          - rocky10_base
          - ubuntu2204_base
          - ubuntu2404_base
          - ubuntu2604_base
        ansible:
          - '2.16'
          - '2.21'
        exclude:
          - box: rocky8_cis
            ansible: '2.21'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: 'trippsc2.adcs'
      - name: Run Molecule tests
        run: |
          source ~/venv/ansible-${{ matrix.ansible }}/bin/activate
          rm -rf ~/.ansible/collections/ansible_collections/*
          cd ./roles/signed_certificate
          molecule test -s linux_pipe
          rm -rf ~/.ansible/collections/ansible_collections/*
          deactivate
        env:
          ANSIBLE_FORCE_COLOR: '1'
          PY_COLORS: '1'
          MOLECULE_BOX: ${{ matrix.box }}
          MOLECULE_ANSIBLE_VERSION: ${{ matrix.ansible }}
  molecule_win:
    name: Run Molecule tests - Windows to file
    runs-on:
      - self-hosted
      - linux
      - ansible
      - x64
    strategy:
      fail-fast: false
      matrix:
        box:
          - w2019_cis
          - w2022_cis
          - w2025_cis
          - w11_24h2_base
          - w11_25h2_base
          - w11_26h2_base
        ansible:
          - '2.16'
          - '2.21'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: 'trippsc2.adcs'
      - name: Run Molecule tests
        run: |
          source ~/venv/ansible-${{ matrix.ansible }}/bin/activate
          rm -rf ~/.ansible/collections/ansible_collections/*
          cd ./roles/signed_certificate
          molecule test -s win
          rm -rf ~/.ansible/collections/ansible_collections/*
          deactivate
        env:
          ANSIBLE_FORCE_COLOR: '1'
          PY_COLORS: '1'
          MOLECULE_BOX: ${{ matrix.box }}
          MOLECULE_ANSIBLE_VERSION: ${{ matrix.ansible }}
  molecule_win_pipe:
    name: Run Molecule tests - Windows to variable
    runs-on:
      - self-hosted
      - linux
      - ansible
      - x64
    strategy:
      fail-fast: false
      matrix:
        box:
          - w2019_cis
          - w2022_cis
          - w2025_cis
          - w11_24h2_base
          - w11_25h2_base
          - w11_26h2_base
        ansible:
          - '2.16'
          - '2.21'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: 'trippsc2.adcs'
      - name: Run Molecule tests
        run: |
          source ~/venv/ansible-${{ matrix.ansible }}/bin/activate
          rm -rf ~/.ansible/collections/ansible_collections/*
          cd ./roles/signed_certificate
          molecule test -s win_pipe
          rm -rf ~/.ansible/collections/ansible_collections/*
          deactivate
        env:
          ANSIBLE_FORCE_COLOR: '1'
          PY_COLORS: '1'
          MOLECULE_BOX: ${{ matrix.box }}
          MOLECULE_ANSIBLE_VERSION: ${{ matrix.ansible }}
